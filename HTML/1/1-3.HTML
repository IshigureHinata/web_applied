<!DOCTYPE html>

    <meta charset="UTF-8" />
    <title>JavaScriptの練習</title>
    
  </head>
  <body>
     
    <p>ページ</p>
    <button onclick="myFunc();">Hello</button>
    <button onclick="showDouble();">2倍を表示</button> 
    <script>
  
        function double(n) {
        return n * 2;
      }

      // ★追加：double() を呼び出して、返ってきた値を表示する
      function showDouble() {
        const result = double(21);            // 返ってきた値を result に入れる
        console.log(`21の2倍は ${result}`);   // → 21の2倍は 42
      }
        let str = prompt("何か入力してください");   // ★追加：ページを開いたときに入力欄が出る

      function myFunc() {
        console.log(str);                         // ★変更："Hello" を str にする
      }
    </script>
