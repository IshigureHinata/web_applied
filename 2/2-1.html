<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
          const a = 5;
      const b = 3;
      const c = 3;
      console.log(a === b);   // 等しい
      console.log(b === c);
      console.log(a > b);
      console.log(b >= c);
      console.log(a !== b);   // 等しくない
         console.log(5 == "5");    // イコール2つ：true  … 型をそろえてから比べる
      console.log(5 === "5");   // イコール3つ：false … 型も含めて比べる
    </script>
</body>
</html>
